name: Core Foundation CI

on:
  push:
    branches:
      - feat/core-foundation
  pull_request:
    branches:
      - main
      - feat/core-foundation
  workflow_dispatch:

jobs:
  verify:
    name: Verify PostgreSQL 16 & Ruff
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: autopilot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d autopilot_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/autopilot_test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Verify PostgreSQL 16 server version
        run: |
          python -c "
          import os
          from sqlalchemy import create_engine, text
          engine = create_engine(os.environ['DATABASE_URL'])
          with engine.connect() as conn:
              version = conn.execute(text('SHOW server_version')).scalar_one()
              print(f'Connected PostgreSQL server_version: {version}')
              assert version.startswith('16.'), f'Expected PostgreSQL 16, got {version}'
          "

      - name: Run Ruff linter
        run: ruff check .
      - name: Apply identity migration
        run: alembic upgrade head

      - name: Run full test suite (fail if any test is skipped)
        run: pytest -v -rs --strict-markers
